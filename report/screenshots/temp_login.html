<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – CAMPUSSHARE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Academic CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    
</head>
<body>

    <!-- Top Sticky Header Navigation -->
    

    <!-- System Announcements Alert Bar -->
    

    <!-- Main Wrapper: Sidebar + Content -->
    <div class="cs-wrapper">
        

        <!-- Main Body Area -->
        <main class="cs-main-content-full">
            <!-- Flash Message Banner Notifications -->
            
                
            

            
<div class="cs-cinematic-screen">
    <!-- Top Transparent Header -->
    <header class="cs-cinematic-header">
        <a href="/" class="cs-cinematic-brand">
            <i class="bi bi-mortarboard-fill"></i>
            <span>CampusShare</span>
        </a>
        <nav class="cs-cinematic-nav-links">
            <a href="/auth/login" class="active-pill">Login</a>
            <a href="/about">About Us</a>
            <a href="/marketplace/overview">Marketplace</a>
            <a href="/auth/register">Register</a>
            <a href="/">Campus Hub</a>
        </nav>
    </header>

    <!-- Centerpiece: Frosted Glass Form Container -->
    <main class="cs-cinematic-center">
        <div class="cs-cinematic-card">
            <!-- Central Academic Emblem -->
            <div class="cs-academic-emblem" title="Verified Campus Ecosystem">
                <i class="bi bi-mortarboard-fill"></i>
            </div>

            <!-- Flash Error/Success Messages -->
            
                
            

            <!-- Main Credentials Form -->
            <form method="POST" action="/auth/login">
                <!-- Frosted Glass Pill Input: Identifier -->
                <div class="cs-pill-input-box">
                    <i class="bi bi-person-fill cs-pill-input-icon"></i>
                    <input type="text" class="cs-pill-input" id="identifier" name="identifier" 
                           value="" placeholder="Username / College ID / Email" 
                           required autofocus autocomplete="username">
                </div>

                <!-- Frosted Glass Pill Input: Password -->
                <div class="cs-pill-input-box">
                    <i class="bi bi-lock-fill cs-pill-input-icon"></i>
                    <input type="password" class="cs-pill-input" id="password" name="password" 
                           placeholder="Password" required autocomplete="current-password">
                </div>

                <!-- Vibrant Coral Pill Action Button -->
                <button type="submit" class="btn-cs-pill-vibrant" id="loginSubmitBtn">
                    <span>GET STARTED</span>
                </button>

                <!-- Sub-row: Keep Logged In switch & Need Help -->
                <div class="cs-pill-meta-row">
                    <label class="cs-pill-switch-wrap" for="rememberMe">
                        <span class="cs-pill-switch">
                            <input type="checkbox" id="rememberMe" name="remember" checked>
                            <span class="cs-pill-slider"></span>
                        </span>
                        <span>Keep Logged In</span>
                    </label>
                    <a href="/auth/register" class="cs-pill-link">Forgot Password?</a>
                </div>

                <!-- Bottom Links Row: CREATE ACCOUNT & NEED HELP? -->
                <div class="cs-pill-links-row">
                    <a href="/auth/register">CREATE ACCOUNT</a>
                    <a href="/impact">NEED HELP?</a>
                </div>
            </form>

            <!-- Quick 1-Click Demo Profiles (Server-Side 1-Click POSTs) -->
            <div class="cs-demo-profiles-strip">
                <div class="cs-demo-label">
                    <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Profiles
                </div>
                <div class="cs-demo-chips-group">
                    <!-- Student 1-Click Form -->
                    <form method="POST" action="/auth/login" class="flex-grow-1 mb-0">
                        <input type="hidden" name="identifier" value="rahul_cse">
                        <input type="hidden" name="password" value="Student@123">
                        <button type="submit" class="cs-demo-chip-btn w-100" title="Sign in as Student Rahul (CSE)">
                            <i class="bi bi-mortarboard-fill text-info"></i> Student
                        </button>
                    </form>

                    <!-- Faculty 1-Click Form -->
                    <form method="POST" action="/auth/login" class="flex-grow-1 mb-0">
                        <input type="hidden" name="identifier" value="prof_sharma">
                        <input type="hidden" name="password" value="Faculty@123">
                        <button type="submit" class="cs-demo-chip-btn w-100" title="Sign in as Faculty Prof. Sharma">
                            <i class="bi bi-person-workspace text-warning"></i> Faculty
                        </button>
                    </form>

                    <!-- Admin 1-Click Form -->
                    <form method="POST" action="/auth/login" class="flex-grow-1 mb-0">
                        <input type="hidden" name="identifier" value="admin">
                        <input type="hidden" name="password" value="Admin@123">
                        <button type="submit" class="cs-demo-chip-btn w-100" title="Sign in as System Administrator">
                            <i class="bi bi-shield-fill-check text-danger"></i> Admin
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Transparent Cinematic Footer -->
    <footer class="cs-cinematic-footer">
        <div class="cs-cinematic-footer-links">
            <a href="/about">About Us</a>
            <a href="/marketplace/overview">Marketplace Guide</a>
            <a href="/impact">Campus Impact</a>
        </div>
        <div>
            &copy; 2026 CampusShare. All Rights Reserved &bull; Smart Campus Ecosystem
        </div>
    </footer>
</div>

        </main>
    </div>

    <!-- Academic Footer -->
    

</body>
</html>
