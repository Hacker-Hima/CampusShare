{% extends "base.html" %}

{% block title %}Change Password – CAMPUSSHARE{% endblock %}

{% block content %}
<div class="py-2">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
            <h4 class="fw-bold text-dark mb-1"><i class="bi bi-shield-lock text-primary me-2"></i>Change Account Password</h4>
            <p class="text-secondary small mb-0">Update your account credentials to keep your campus account secure.</p>
        </div>
        <a href="{{ url_for('profile.view_profile') }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Profile
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="cs-card">
                <form method="POST" action="{{ url_for('profile.change_password') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Current Password <span class="text-danger">*</span></label>
                        <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">New Password <span class="text-danger">*</span></label>
                        <input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-dark">Confirm New Password <span class="text-danger">*</span></label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="6" required>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('profile.view_profile') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-cs-primary btn-sm px-4">
                            <i class="bi bi-check2 me-1"></i> Update Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
